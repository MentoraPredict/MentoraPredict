# Only actually upgrades the connection when the client asked for it
# (Upgrade header present, e.g. the Socket.IO handshake under /api/socket.io).
# Regular HTTP requests under /api/ get "close" here, same as before.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

# $remote_addr here is Cloudflare's own edge IP (it terminates the client
# connection in front of this origin), not the real visitor — forwarding
# that on as X-Real-IP made Kong's rate-limiting effectively shared across
# every visitor proxied through the same Cloudflare edge. Prefer the
# CF-Connecting-IP header Cloudflare sets to the actual client IP, falling
# back to $remote_addr for direct/non-Cloudflare access (local dev, health
# checks).
map $http_cf_connecting_ip $real_client_ip {
  default $http_cf_connecting_ip;
  ""      $remote_addr;
}

server {
  listen 80;
  server_tokens off;
  server_name localhost mentorapredictqa.programacionwebuce.net;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;

  location / {
    try_files $uri /index.html;
  }

  # Public installer files/manifests (see cd-qa.yml/cd-main.yml). The desktop
  # app fetches these from its own mentorapredict:// origin, which is a real
  # cross-origin request — without this header the browser blocks the
  # response even though nginx serves it fine.
  location /downloads/ {
    add_header Access-Control-Allow-Origin "*" always;
  }

  location /api/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://kong:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $real_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffers 8 16k;
    proxy_buffer_size 32k;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
  }

  location = /favicon.png {
    add_header Cache-Control "public, max-age=3600";
    access_log off;
  }

  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }
}

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
