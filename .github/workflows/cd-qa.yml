name: Deploy to QA

on:
  push:
    branches: [QA]

concurrency:
  group: qa-deploy
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  EXPO_PUBLIC_API_ENV: qa
  EXPO_PUBLIC_API_BASE_URL: https://mentorapredictqa.programacionwebuce.net/api

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.generate-matrix.outputs.has_changes }}
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
      docker_matrix: ${{ steps.generate-matrix.outputs.docker_matrix }}
      changed_services: ${{ steps.generate-matrix.outputs.changed_services }}
      mobile_changed: ${{ steps.filter.outputs.mobile }}
      desktop_changed: ${{ steps.filter.outputs.desktop }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth-service:
              - 'services/auth-service/**'
            academic-service:
              - 'services/academic-service/**'
            user-service:
              - 'services/user-service/**'
            analytics-service:
              - 'services/analytics-service/**'
            prediction-service:
              - 'services/prediction-service/**'
            web:
              - 'apps/web/**'
            landing:
              - 'apps/landing/**'
            mobile:
              - 'apps/mobile/**'
            desktop:
              - 'apps/desktop/**'
              - 'apps/web/**'
            kong:
              - 'infra/kong/**'
              - 'infra/keys/**'
            monitoring:
              - 'infra/monitoring/**'
            infra:
              - 'infra/docker/**'
            packages:
              - 'packages/**'

      - name: Generate Dynamic Matrix
        id: generate-matrix
        run: |
          AUTH_CHANGED=${{ steps.filter.outputs.auth-service }}
          ACADEMIC_CHANGED=${{ steps.filter.outputs.academic-service }}
          USER_CHANGED=${{ steps.filter.outputs.user-service }}
          ANALYTICS_CHANGED=${{ steps.filter.outputs.analytics-service }}
          PREDICTION_CHANGED=${{ steps.filter.outputs.prediction-service }}
          WEB_CHANGED=${{ steps.filter.outputs.web }}
          LANDING_CHANGED=${{ steps.filter.outputs.landing }}
          KONG_CHANGED=${{ steps.filter.outputs.kong }}
          MONITORING_CHANGED=${{ steps.filter.outputs.monitoring }}
          INFRA_CHANGED=${{ steps.filter.outputs.infra }}
          PACKAGES_CHANGED=${{ steps.filter.outputs.packages }}

          if [ "$PACKAGES_CHANGED" = "true" ] || [ "$INFRA_CHANGED" = "true" ]; then
            AUTH_CHANGED="true"
            ACADEMIC_CHANGED="true"
            USER_CHANGED="true"
            ANALYTICS_CHANGED="true"
            PREDICTION_CHANGED="true"
            WEB_CHANGED="true"
            LANDING_CHANGED="true"
            KONG_CHANGED="true"
            MONITORING_CHANGED="true"
          fi

          jq -n \
            --arg AUTH "$AUTH_CHANGED" \
            --arg ACADEMIC "$ACADEMIC_CHANGED" \
            --arg USER "$USER_CHANGED" \
            --arg ANALYTICS "$ANALYTICS_CHANGED" \
            --arg PREDICTION "$PREDICTION_CHANGED" \
            --arg WEB "$WEB_CHANGED" \
            --arg LANDING "$LANDING_CHANGED" \
            --arg KONG "$KONG_CHANGED" \
            '{
              "include": [
                if $AUTH == "true" then {"service":"auth-service","type":"docker","dockerfile":"services/auth-service/Dockerfile","changed":"true"} else empty end,
                if $ACADEMIC == "true" then {"service":"academic-service","type":"docker","dockerfile":"services/academic-service/Dockerfile","changed":"true"} else empty end,
                if $USER == "true" then {"service":"user-service","type":"docker","dockerfile":"services/user-service/Dockerfile","changed":"true"} else empty end,
                if $ANALYTICS == "true" then {"service":"analytics-service","type":"docker","dockerfile":"services/analytics-service/Dockerfile","changed":"true"} else empty end,
                if $PREDICTION == "true" then {"service":"prediction-service","type":"docker","dockerfile":"services/prediction-service/Dockerfile","changed":"true"} else empty end,
                if $WEB == "true" then {"service":"web","type":"docker","dockerfile":"apps/web/Dockerfile","changed":"true"} else empty end,
                if $LANDING == "true" then {"service":"landing","type":"docker","dockerfile":"apps/landing/Dockerfile","changed":"true"} else empty end,
                if $KONG == "true" then {"service":"kong","type":"compose","changed":"true"} else empty end
              ]
            }' > matrix.json

          matrix=$(jq -c . matrix.json)
          docker_matrix=$(jq -c '.include |= map(select(.type=="docker"))' matrix.json)
          has_changes=$(jq -c '.include | length > 0' matrix.json)
          changed_services=$(jq -r '[.include[].service] | join(", ")' matrix.json)

          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          echo "docker_matrix=$docker_matrix" >> $GITHUB_OUTPUT
          echo "has_changes=$has_changes" >> $GITHUB_OUTPUT
          echo "changed_services=$changed_services" >> $GITHUB_OUTPUT

      - name: Debug outputs
        run: |
          echo "HAS CHANGES: ${{ steps.generate-matrix.outputs.has_changes }}"
          echo "CHANGED SERVICES: ${{ steps.generate-matrix.outputs.changed_services }}"
          echo "MATRIX: ${{ steps.generate-matrix.outputs.matrix }}"
          echo "DOCKER MATRIX: ${{ steps.generate-matrix.outputs.docker_matrix }}"

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.has_changes == 'true' &&
      github.ref == 'refs/heads/QA'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.docker_matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Debug matrix
        run: |
          echo "service: ${{ matrix.service }}"
          echo "type: ${{ matrix.type }}"

      - name: Build Summary
        run: |
          echo "## Docker Build Status" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Mode |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ matrix.service }} | QA |" >> $GITHUB_STEP_SUMMARY

      - name: Validate Secrets
        run: |
          test -n "${DOCKERHUB_USERNAME}"
          test -n "${DOCKERHUB_TOKEN}"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Metadata
        if: matrix.type == 'docker'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}
          tags: |
            type=raw,value=qa-latest
            type=sha,prefix=qa-,format=short

      - name: Setup Docker Buildx
        if: matrix.type == 'docker'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: matrix.type == 'docker'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Trivy filesystem scanner
        if: matrix.type == 'docker'
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: Build and Push Image
        if: matrix.type == 'docker'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-mobile-apk:
    name: Build Mobile APK (QA)
    runs-on: ubuntu-latest
    needs: detect-changes
    timeout-minutes: 30
    if: >
      needs.detect-changes.outputs.mobile_changed == 'true' &&
      github.ref == 'refs/heads/QA'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prebuild native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android

      - name: Configure release signing
        working-directory: apps/mobile/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/mentorapredict-release.jks
          cat >> app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file(MENTORAPREDICT_RELEASE_STORE_FILE)
                      storePassword MENTORAPREDICT_RELEASE_STORE_PASSWORD
                      keyAlias MENTORAPREDICT_RELEASE_KEY_ALIAS
                      keyPassword MENTORAPREDICT_RELEASE_KEY_PASSWORD
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          ORG_GRADLE_PROJECT_MENTORAPREDICT_RELEASE_STORE_FILE: mentorapredict-release.jks
          ORG_GRADLE_PROJECT_MENTORAPREDICT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MENTORAPREDICT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MENTORAPREDICT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mentorapredict-qa-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  build-desktop-app:
    name: Build Desktop App (QA)
    runs-on: windows-latest
    needs: detect-changes
    timeout-minutes: 30
    if: >
      needs.detect-changes.outputs.desktop_changed == 'true' &&
      github.ref == 'refs/heads/QA'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop app
        working-directory: apps/desktop
        run: pnpm package:qa

      - name: Upload desktop installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: mentorapredict-desktop-qa
          path: apps/desktop/release/*.msi
          retention-days: 30

  deploy-to-qa:
    name: Deploy to EC2 QA
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push]
    environment: QA enviroment
    timeout-minutes: 30
    if: >
      needs.detect-changes.outputs.has_changes == 'true' &&
      github.ref == 'refs/heads/QA'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: QA

      - name: Deploy Summary
        run: |
          echo "## QA Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Changed Services | ${{ needs.detect-changes.outputs.changed_services }} |" >> $GITHUB_STEP_SUMMARY

      - name: Resolve deploy SHA
        id: sha
        run: echo "value=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            DEPLOY_SHA="${{ steps.sha.outputs.value }}"
            SHORT_SHA=$(echo "$DEPLOY_SHA" | cut -c1-7)
            IMAGE_TAG="qa-${SHORT_SHA}"
            CHANGED_SERVICES="${{ needs.detect-changes.outputs.changed_services }}"
            SERVICES_LIST=$(echo "$CHANGED_SERVICES" | tr ',' ' ')

            sudo mkdir -p /opt/mentorapredict
            sudo chown ubuntu:ubuntu /opt/mentorapredict
            cd /opt/mentorapredict

            if [ -d ".git" ]; then
              git fetch origin
              git reset --hard origin/QA
            else
              git clone https://github.com/${{ github.repository }} .
              git checkout QA
            fi

            echo "[ENV] Creating .env"
            cat > .env << EOF
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            MONGO_USER=${{ secrets.MONGO_USER }}
            MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}
            MONGO_DB=${{ secrets.MONGO_DB }}
            KONG_PROXY_PORT=${{ secrets.KONG_PROXY_PORT }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_MODEL=${{ secrets.OPENAI_MODEL }}
            SWAGGER_SERVER_URL=${{ secrets.SWAGGER_SERVER_URL }}
            EXPO_PUBLIC_API_ENV=qa
            EXPO_PUBLIC_API_BASE_URL=https://mentorapredictqa.programacionwebuce.net/api
            EOF

            echo "JWT_PRIVATE_KEY=$(printf '%s' '${{ secrets.JWT_PRIVATE_KEY }}' | base64 -w0)" >> .env
            echo "JWT_PUBLIC_KEY=$(printf '%s' '${{ secrets.JWT_PUBLIC_KEY }}' | base64 -w0)" >> .env

            echo "WEB_PORT=80" >> .env

            if docker pull ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:${IMAGE_TAG} &>/dev/null; then
              echo "[TAG] Using build tag: ${IMAGE_TAG}"
            else
              echo "[TAG] Build tag ${IMAGE_TAG} not found — using branch latest"
              IMAGE_TAG="qa-latest"
            fi

            echo "IMAGE_TAG=${IMAGE_TAG}" >> .env

            echo "[SELECTIVE DEPLOY] Changed services: $CHANGED_SERVICES"

            echo "[KEYS] Creating certificate directories..."
            sudo mkdir -p /opt/mentorapredict/infra/keys
            sudo chown ubuntu:ubuntu /opt/mentorapredict/infra/keys

            echo "[INFRA] Starting infrastructure"
            docker compose --env-file .env -f infra/docker/docker-compose.infra.yml up -d postgres mongo redis

            echo "[WAIT DB READY]"
            for i in {1..20}; do
              docker exec $(docker ps -q --filter name=postgres) pg_isready && break
              echo "waiting postgres..."
              sleep 3
            done

            echo "[CLEANUP] Docker disk usage before cleanup"
            docker system df
            df -h

            echo "[CLEANUP] Removing stopped containers, old images, and old build cache"
            docker container prune -f
            docker image prune -af --filter "until=24h"
            timeout 180 docker builder prune -af --filter "until=24h" || echo "[CLEANUP] Builder prune timed out, continuing deploy"

            echo "[CLEANUP] Docker disk usage after cleanup"
            docker system df
            df -h

            echo "[PULL IMAGES] Changed: $CHANGED_SERVICES"
            docker compose --env-file .env -f infra/docker/docker-compose.qa.yml pull $SERVICES_LIST

            echo "[START SERVICES] Starting only changed: $CHANGED_SERVICES"
            docker compose --env-file .env -f infra/docker/docker-compose.qa.yml up -d --force-recreate $SERVICES_LIST

            echo "[SEEDS] Running database seeds (idempotent safe mode)"
            docker compose --env-file .env -f infra/docker/docker-compose.qa.yml up \
              --build \
              --force-recreate \
              --abort-on-container-exit \
              --exit-code-from seed-loader \
              seed-loader

            echo "[MONITORING] Starting monitoring stack"
            docker compose --env-file .env -f infra/monitoring/docker-compose.monitoring.yml --project-name mentorapredict up -d 2>&1 || echo "[MONITORING] Monitoring stack not available — skipping"

            docker system prune -af --filter "until=24h"

            echo "[OK] Deployment completed"
            echo ""
            echo "[STATUS] Final services status:"
            docker compose --env-file .env -f infra/docker/docker-compose.qa.yml ps -a
            docker compose --env-file .env -f infra/docker/docker-compose.infra.yml ps -a

      - name: Deployment Summary
        run: |
          echo "## QA Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Deploy SHA: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Changed: ${{ needs.detect-changes.outputs.changed_services }}" >> $GITHUB_STEP_SUMMARY
          echo "- Strategy: Selective build from registry (QA)" >> $GITHUB_STEP_SUMMARY

  create-qa-release:
    name: Create QA Release Tag
    if: success() && needs.deploy-to-qa.result == 'success'
    uses: ./.github/workflows/release.yml
    needs: deploy-to-qa
    with:
      tag-prefix: qa-v
      prerelease: true
      release-name: "QA Release"
