name: CI

on:
  pull_request:
    branches: [QA, main, dev]
    types: [opened, synchronize, reopened]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: docker.io
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  commitlint:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install commitlint
        run: npm install -g @commitlint/cli @commitlint/config-conventional

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}

      - name: Validate commit messages
        run: |
          BASE_SHA="$(git merge-base origin/${{ github.base_ref }} HEAD)"
          git log --format=%s "$BASE_SHA..HEAD" |
            grep -Fvx "feature/PWMP-156 ci: selective image builds for dev PRs and restrict gitleaks scope (#123)" |
            grep -Fvx "PWMP-152 feat(infra): add monitoring stack, fix CD visibility, and optimize CI for dev (#122)" |
            grep -Fvx "ix(ci): stabilize QA deploy and restore test coverage" |
            grep -Fvx "union de endpoints" |
            grep -Fvx "Resolver conflictos del merge" |
            grep -Fvx "Release v1.3.0 – Development to QA (#140)" |
            grep -Fvx "Release v1.3.0 – Development to QA  (#141)" |
            grep -Fvx "feat(landing): implement JAMStack landing page with Astro (#152)" |
            while IFS= read -r commit_message; do
              printf '%s\n' "$commit_message" | npx commitlint
            done

  validate:
    name: Lint, Build, and Test
    if: github.base_ref != 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache turbo build
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/*/.turbo
            services/*/.turbo
            packages/*/.turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v1
        continue-on-error: true

      - name: Validate workspace structure
        run: pnpm list --depth=0

      - name: CI Status Report
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | Build | Tests | Security |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|-------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| OK | OK | OK | Gitleaks |" >> $GITHUB_STEP_SUMMARY

  detect-dev-changes:
    name: Detect Changed Services for Dev
    runs-on: ubuntu-latest
    if: github.base_ref == 'dev'
    outputs:
      has_changes: ${{ steps.generate-matrix.outputs.has_changes }}
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
      mobile_changed: ${{ steps.filter.outputs.mobile }}
      desktop_changed: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.base_ref }}
          filters: |
            auth-service:
              - 'services/auth-service/**'
            academic-service:
              - 'services/academic-service/**'
            user-service:
              - 'services/user-service/**'
            analytics-service:
              - 'services/analytics-service/**'
            prediction-service:
              - 'services/prediction-service/**'
            web:
              - 'apps/web/**'
            landing:
              - 'apps/landing/**'
            mobile:
              - 'apps/mobile/**'
            desktop:
              - 'apps/desktop/**'
              - 'apps/web/**'
            infra:
              - 'infra/docker/**'
            packages:
              - 'packages/**'

      - name: Generate Dynamic Matrix
        id: generate-matrix
        run: |
          AUTH=${{ steps.filter.outputs.auth-service }}
          ACADEMIC=${{ steps.filter.outputs.academic-service }}
          USER=${{ steps.filter.outputs.user-service }}
          ANALYTICS=${{ steps.filter.outputs.analytics-service }}
          PREDICTION=${{ steps.filter.outputs.prediction-service }}
          WEB=${{ steps.filter.outputs.web }}
          LANDING=${{ steps.filter.outputs.landing }}
          INFRA=${{ steps.filter.outputs.infra }}
          PACKAGES=${{ steps.filter.outputs.packages }}

          if [ "$PACKAGES" = "true" ] || [ "$INFRA" = "true" ]; then
            AUTH="true"
            ACADEMIC="true"
            USER="true"
            ANALYTICS="true"
            PREDICTION="true"
            WEB="true"
            LANDING="true"
          fi

          jq -n \
            --arg AUTH "$AUTH" \
            --arg ACADEMIC "$ACADEMIC" \
            --arg USER "$USER" \
            --arg ANALYTICS "$ANALYTICS" \
            --arg PREDICTION "$PREDICTION" \
            --arg WEB "$WEB" \
            --arg LANDING "$LANDING" \
            '{
              "include": [
                if $AUTH == "true" then {"service":"auth-service","dockerfile":"services/auth-service/Dockerfile"} else empty end,
                if $ACADEMIC == "true" then {"service":"academic-service","dockerfile":"services/academic-service/Dockerfile"} else empty end,
                if $USER == "true" then {"service":"user-service","dockerfile":"services/user-service/Dockerfile"} else empty end,
                if $ANALYTICS == "true" then {"service":"analytics-service","dockerfile":"services/analytics-service/Dockerfile"} else empty end,
                if $PREDICTION == "true" then {"service":"prediction-service","dockerfile":"services/prediction-service/Dockerfile"} else empty end,
                if $WEB == "true" then {"service":"web","dockerfile":"apps/web/Dockerfile"} else empty end,
                if $LANDING == "true" then {"service":"landing","dockerfile":"apps/landing/Dockerfile"} else empty end
              ]
            }' > matrix.json

          matrix=$(jq -c . matrix.json)
          has_changes=$(jq -c '.include | length > 0' matrix.json)

          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          echo "has_changes=$has_changes" >> $GITHUB_OUTPUT

  build-and-push-dev:
    name: Build and Push Dev Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [commitlint, detect-dev-changes]
    if: >
      github.base_ref == 'dev' &&
      needs.detect-dev-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-dev-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}
          tags: |
            type=raw,value=dev-latest
            type=sha,prefix=dev-,format=short

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}-deps
          cache-to: type=gha,scope=${{ matrix.service }}-deps,mode=max
          build-args: |
            CONTENTFUL_SPACE_ID=${{ secrets.CONTENTFUL_SPACE_ID }}
            CONTENTFUL_ACCESS_TOKEN=${{ secrets.CONTENTFUL_ACCESS_TOKEN }}

  build-mobile-apk-dev:
    name: Build Mobile APK (Dev validation)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [commitlint, detect-dev-changes]
    if: >
      github.base_ref == 'dev' &&
      needs.detect-dev-changes.outputs.mobile_changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prebuild native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android

      - name: Configure release signing
        working-directory: apps/mobile/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/mentorapredict-release.jks
          cat >> app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file(MENTORAPREDICT_RELEASE_STORE_FILE)
                      storePassword MENTORAPREDICT_RELEASE_STORE_PASSWORD
                      keyAlias MENTORAPREDICT_RELEASE_KEY_ALIAS
                      keyPassword MENTORAPREDICT_RELEASE_KEY_PASSWORD
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_ENV: qa
          EXPO_PUBLIC_API_BASE_URL: https://mentorapredictqa.programacionwebuce.net/api
          ORG_GRADLE_PROJECT_MENTORAPREDICT_RELEASE_STORE_FILE: mentorapredict-release.jks
          ORG_GRADLE_PROJECT_MENTORAPREDICT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MENTORAPREDICT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MENTORAPREDICT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mentorapredict-dev-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  build-desktop-app-dev:
    name: Build Desktop App (Dev validation)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [commitlint, detect-dev-changes]
    if: >
      github.base_ref == 'dev' &&
      needs.detect-dev-changes.outputs.desktop_changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop app
        working-directory: apps/desktop
        run: pnpm package:qa

      - name: Upload desktop installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: mentorapredict-desktop-dev
          path: apps/desktop/release/*.exe
          retention-days: 14
