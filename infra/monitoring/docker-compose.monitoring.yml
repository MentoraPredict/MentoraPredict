networks:
  mentorapredict-net:
    name: mp_network
    external: true

volumes:
  grafana_data:
    name: mp_grafana_data

services:
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: mp_node_exporter
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 96M
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    networks:
      - mentorapredict-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: mp_cadvisor
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 192M
    security_opt:
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
      - SYS_TIME
    devices:
      - /dev/kmsg:/dev/kmsg
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - mentorapredict-net

  grafana:
    image: grafana/grafana:10.4.2
    container_name: mp_grafana
    user: "472:472"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 320M
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://mentorapredictqa.programacionwebuce.net/grafana}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Grafana 10's CSRF middleware rejects data-source query POSTs
      # ("origin not allowed") unless the browser's Origin header is
      # explicitly trusted — root_url alone doesn't cover this behind a
      # reverse proxy. Bare host:port, no scheme, per Grafana's docs.
      GF_SECURITY_CSRF_TRUSTED_ORIGINS: ${GRAFANA_TRUSTED_ORIGIN:-mentorapredictqa.programacionwebuce.net}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - mentorapredict-net
