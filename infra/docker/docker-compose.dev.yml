# MentoraPredict — Development stack (DB-less Kong + core services)
# Usage:
# 1. cp ../.env.example ../.env
# 2. (optional en caso de tener los archivos .pem) bash infra/kong/generate-keys.sh
# 3. Levantar todo el stack reconstruyendo imagenes:
#    docker-compose -p mentorapredict -f infra/docker/docker-compose.dev.yml --env-file .\infra\.env up -d --build
#
# Este compose usa imagenes compiladas, sin hot reload.
# La compilacion ocurre durante el build de la imagen; los contenedores ejecutan dist/main.js o nginx.
#
# Si cambias codigo o dependencias, reconstruye el servicio afectado:
#    docker-compose -p mentorapredict -f infra/docker/docker-compose.dev.yml --env-file .\infra\.env up -d --build web kong
#    docker-compose -p mentorapredict -f infra/docker/docker-compose.dev.yml --env-file .\infra\.env up -d --build academic-service
#
# Si solo quieres recrear contenedores sin reconstruir imagenes:
#    docker-compose -p mentorapredict -f infra/docker/docker-compose.dev.yml --env-file .\infra\.env up -d --force-recreate
#
# Ejecutar semillas cuando los servicios esten healthy:
#    docker-compose -p mentorapredict -f infra/docker/docker-compose.dev.yml --env-file .\infra\.env up --force-recreate seed-loader

networks:
  mentorapredict-net:
    name: mp_network
    driver: bridge

volumes:
  postgres_data:
    name: mp_dev_postgres_data
  mongo_data:
    name: mp_dev_mongo_data
  redis_data:
    name: mp_dev_redis_data
  academic_uploads_data:
    name: mp_dev_academic_uploads_data
  user_uploads_data:
    name: mp_dev_user_uploads_data

services:
  postgres:
    image: postgres:16-alpine
    container_name: mp_dev_postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mp_secret_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-mentorapredict}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mentorapredict-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mp_user} -d ${POSTGRES_DB:-mentorapredict}",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo:
    image: mongo:7.0
    container_name: mp_dev_mongo
    restart: unless-stopped
    command: ["mongod", "--quiet"]
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mp_mongo_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mp_mongo_secret_change_in_prod}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-mentorapredict_nosql}
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - mentorapredict-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "db.adminCommand(''ping'').ok" | grep 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: mp_mongo_ui
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 192M
    profiles: ["tools"]
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_URL: "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_UI_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_UI_PASSWORD:-admin}
    ports:
      - "8082:8081"
    networks:
      - mentorapredict-net
    depends_on:
      mongo:
        condition: service_healthy

  redis:
    image: redis:7.2-alpine
    container_name: mp_dev_redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-mp_redis_secret_change_in_prod}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - mentorapredict-net
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-mp_redis_secret_change_in_prod}",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-commander:
    image: rediscommander/redis-commander:0.7.2
    container_name: mp_redis_ui
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 192M
    profiles: ["tools"]
    environment:
      REDIS_HOSTS: "local:redis:6379:0:${REDIS_PASSWORD}"
      HTTP_USER: ${REDIS_UI_USER:-admin}
      HTTP_PASSWORD: ${REDIS_UI_PASSWORD:-admin}
    ports:
      - "8081:8081"
    networks:
      - mentorapredict-net
    depends_on:
      redis:
        condition: service_healthy

  kong:
    image: kong:3.6
    container_name: mp_dev_kong
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 384M
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/secrets/public.pem}
      WEB_UPSTREAM_PORT: ${WEB_UPSTREAM_PORT:-80}
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
      - "${KONG_ADMIN_PORT:-8001}:8001"
    volumes:
      - ../kong/kong-template.yml:/etc/kong/kong-template.yml:ro
      - ../kong/entrypoint.sh:/entrypoint.sh:ro
      - ../keys:/secrets:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    networks:
      - mentorapredict-net
    depends_on:
      web:
        condition: service_started
        restart: true
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  konga:
    image: pantsel/konga:0.14.9
    container_name: mp_dev_konga
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    profiles: ["tools"]
    environment:
      NODE_ENV: development
      DB_ADAPTER: localDiskDb
      KONGA_HOOK_TIMEOUT: 120000
    ports:
      - "${KONGA_PORT:-1337}:1337"
    networks:
      - mentorapredict-net
    depends_on:
      kong:
        condition: service_healthy

  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    image: ${DOCKERHUB_USERNAME}/auth-service:${DEV_IMAGE_TAG:-dev-latest}
    container_name: mp_dev_auth_service
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_PORT: ${AUTH_SERVICE_PORT:-3001}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-mp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mp_secret_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-mentorapredict}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-mp_redis_secret_change_in_prod}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/secrets/private.pem}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/secrets/public.pem}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8081,http://127.0.0.1:8081,http://localhost:8000}
      SWAGGER_SERVER_URL: ${SWAGGER_SERVER_URL:-http://localhost:8000}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:3002}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:8000/api/v1/auth/microsoft/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8000}
    volumes:
      - ../keys:/secrets:ro
    networks:
      - mentorapredict-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3001/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  user-service:
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
    image: ${DOCKERHUB_USERNAME}/user-service:${DEV_IMAGE_TAG:-dev-latest}
    container_name: mp_dev_user_service
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 384M
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_PORT: ${USER_SERVICE_PORT:-3002}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-mp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mp_secret_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-mentorapredict}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-mp_redis_secret_change_in_prod}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8081,http://127.0.0.1:8081,http://localhost:8000}
      SWAGGER_SERVER_URL: ${SWAGGER_SERVER_URL:-http://localhost:8000}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/secrets/private.pem}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/secrets/public.pem}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:3001}
      UPLOADS_DIR: /app/services/user-service/uploads
    volumes:
      - ../keys:/secrets:ro
      - user_uploads_data:/app/services/user-service/uploads
    networks:
      - mentorapredict-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3002/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  academic-service:
    build:
      context: ../..
      dockerfile: services/academic-service/Dockerfile
    image: ${DOCKERHUB_USERNAME}/academic-service:${DEV_IMAGE_TAG:-dev-latest}
    container_name: mp_dev_academic_service
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 512M
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_PORT: ${ACADEMIC_SERVICE_PORT:-3003}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-mp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mp_secret_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-mentorapredict}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-mp_redis_secret_change_in_prod}
      MONGO_HOST: ${MONGO_HOST:-mongo}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_USER: ${MONGO_USER:-mp_mongo_user}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-mp_mongo_secret_change_in_prod}
      MONGO_DB: ${MONGO_DB:-mentorapredict_nosql}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8081,http://127.0.0.1:8081,http://localhost:8000}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:3002}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/secrets/private.pem}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/secrets/public.pem}
      SWAGGER_SERVER_URL: ${SWAGGER_SERVER_URL:-http://localhost:8000}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      UPLOADS_DIR: /app/services/academic-service/uploads
    volumes:
      - ../keys:/secrets:ro
      - academic_uploads_data:/app/services/academic-service/uploads
    networks:
      - mentorapredict-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3003/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  analytics-service:
    build:
      context: ../..
      dockerfile: services/analytics-service/Dockerfile
    image: ${DOCKERHUB_USERNAME}/analytics-service:${DEV_IMAGE_TAG:-dev-latest}
    container_name: mp_dev_analytics_service
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 640M
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_PORT: ${ANALYTICS_SERVICE_PORT:-3004}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-mp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mp_secret_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-mentorapredict}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-mp_redis_secret_change_in_prod}
      MONGO_HOST: ${MONGO_HOST:-mongo}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_USER: ${MONGO_USER:-mp_mongo_user}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-mp_mongo_secret_change_in_prod}
      MONGO_DB: ${MONGO_DB:-mentorapredict_nosql}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/secrets/private.pem}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/secrets/public.pem}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      ACADEMIC_SERVICE_URL: ${ACADEMIC_SERVICE_URL:-http://academic-service:3003}
      RISK_HIGH_THRESHOLD: ${RISK_HIGH_THRESHOLD:-40}
      RISK_CRITICAL_THRESHOLD: ${RISK_CRITICAL_THRESHOLD:-25}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8081,http://127.0.0.1:8081,http://localhost:8000}
      SWAGGER_SERVER_URL: ${SWAGGER_SERVER_URL:-http://localhost:8000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    volumes:
      - ../keys:/secrets:ro
    networks:
      - mentorapredict-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3004/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  prediction-service:
    build:
      context: ../..
      dockerfile: services/prediction-service/Dockerfile
    image: ${DOCKERHUB_USERNAME}/prediction-service:${DEV_IMAGE_TAG:-dev-latest}
    container_name: mp_dev_prediction_service
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 512M
    ports:
      - "3006:3006"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_PORT: ${PREDICTION_SERVICE_PORT:-3006}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-mp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mp_secret_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-mentorapredict}
      MONGO_HOST: ${MONGO_HOST:-mongo}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_USER: ${MONGO_USER:-mp_mongo_user}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-mp_mongo_secret_change_in_prod}
      MONGO_DB: ${MONGO_DB:-mentorapredict_nosql}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/secrets/private.pem}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/secrets/public.pem}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      ANALYTICS_SERVICE_URL: ${ANALYTICS_SERVICE_URL:-http://analytics-service:3004}
      ACADEMIC_SERVICE_URL: ${ACADEMIC_SERVICE_URL:-http://academic-service:3003}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8081,http://127.0.0.1:8081,http://localhost:8000}
      SWAGGER_SERVER_URL: ${SWAGGER_SERVER_URL:-http://localhost:8000}
    volumes:
      - ../keys:/secrets:ro
    networks:
      - mentorapredict-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3006/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: ${DOCKERHUB_USERNAME}/web:${DEV_IMAGE_TAG:-dev-latest}
    container_name: mp_web
    restart: unless-stopped
    init: true
    ports:
      - "${WEB_PORT:-3000}:80"
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 192M
    expose:
      - "80"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    networks:
      - mentorapredict-net

  landing:
    build:
      context: ../..
      dockerfile: apps/landing/Dockerfile
    image: ${DOCKERHUB_USERNAME}/landing:${DEV_IMAGE_TAG:-dev-latest}
    container_name: mp_landing
    restart: unless-stopped
    init: true
    ports:
      - "${LANDING_PORT:-4321}:80"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    expose:
      - "80"
    networks:
      - mentorapredict-net

  seed-loader:
    build:
      context: ../..
      dockerfile: database/Dockerfile.seed
    container_name: mp_dev_seed_loader
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    restart: "no"
    init: true
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-mp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mp_secret_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-mentorapredict}
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    networks:
      - mentorapredict-net
