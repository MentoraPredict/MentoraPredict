# MentoraPredict — Production/QA Core Stack (Services + Gateway Only)
# Usage:
# 1. docker compose -p mentorapredict -f infra/docker/docker-compose.prod.yml --env-file .env up -d

networks:
  mentorapredict-net:
    name: mp_network
    external: true

volumes:
  academic_uploads_data:
    name: mp_academic_uploads_data
  user_uploads_data:
    name: mp_user_uploads_data

services:
  kong:
    image: kong:3.6
    container_name: mp_kong
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 320M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
      - "${KONG_ADMIN_PORT:-8001}:8001"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/secrets/public.pem}
    volumes:
      - ../kong/kong-template.yml:/etc/kong/kong-template.yml:ro
      - ../kong/entrypoint.sh:/entrypoint.sh:ro
      - ../keys:/secrets:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    networks:
      - mentorapredict-net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  konga:
    image: pantsel/konga:0.14.9
    container_name: mp_konga
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    profiles: ["tools"]
    environment:
      NODE_ENV: development
      DB_ADAPTER: localDiskDb
      KONGA_HOOK_TIMEOUT: 120000
    ports:
      - "${KONGA_PORT:-1337}:1337"
    networks:
      - mentorapredict-net
    depends_on:
      kong:
        condition: service_healthy

  auth-service:
    image: ${DOCKERHUB_USERNAME}/auth-service:${IMAGE_TAG:-main-latest}
    container_name: mp_auth_service
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 320M
    expose:
      - "3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://mp_user_service:3002}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SWAGGER_SERVER_URL: ${SWAGGER_SERVER_URL:-https://mentorapredictprod.programacionwebuce.net}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-https://mentorapredictprod.programacionwebuce.net/api/v1/auth/microsoft/callback}
      FRONTEND_URL: ${FRONTEND_URL:-https://mentorapredictprod.programacionwebuce.net}
    networks:
      - mentorapredict-net
    volumes:
      - ../keys:/secrets:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  user-service:
    image: ${DOCKERHUB_USERNAME}/user-service:${IMAGE_TAG:-main-latest}
    container_name: mp_user_service
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 320M
    expose:
      - "3002"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SWAGGER_SERVER_URL: ${SWAGGER_SERVER_URL:-https://mentorapredictprod.programacionwebuce.net}
      JWT_SECRET: ${JWT_SECRET}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/secrets/private.pem}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/secrets/public.pem}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:3001}
      UPLOADS_DIR: /app/services/user-service/uploads
    volumes:
      - ../keys:/secrets:ro
      - user_uploads_data:/app/services/user-service/uploads
    networks:
      - mentorapredict-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  academic-service:
    image: ${DOCKERHUB_USERNAME}/academic-service:${IMAGE_TAG:-main-latest}
    container_name: mp_academic_service
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 448M
    expose:
      - "3003"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3003
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MONGO_HOST: ${MONGO_HOST:-mongo}
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DB: ${MONGO_DB}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SWAGGER_SERVER_URL: ${SWAGGER_SERVER_URL:-https://mentorapredictprod.programacionwebuce.net}
      JWT_SECRET: ${JWT_SECRET}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://mp_user_service:3002}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      UPLOADS_DIR: /app/services/academic-service/uploads
    networks:
      - mentorapredict-net
    volumes:
      - ../keys:/secrets:ro
      - academic_uploads_data:/app/services/academic-service/uploads
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  analytics-service:
    image: ${DOCKERHUB_USERNAME}/analytics-service:${IMAGE_TAG:-main-latest}
    container_name: mp_analytics_service
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 512M
    expose:
      - "3004"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3004
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MONGO_HOST: ${MONGO_HOST:-mongo}
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DB: ${MONGO_DB}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SWAGGER_SERVER_URL: ${SWAGGER_SERVER_URL:-https://mentorapredictprod.programacionwebuce.net}
      JWT_SECRET: ${JWT_SECRET}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      ACADEMIC_SERVICE_URL: ${ACADEMIC_SERVICE_URL:-http://mp_academic_service:3003}
      RISK_HIGH_THRESHOLD: ${RISK_HIGH_THRESHOLD:-40}
      RISK_CRITICAL_THRESHOLD: ${RISK_CRITICAL_THRESHOLD:-25}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    volumes:
      - ../keys:/secrets:ro
    networks:
      - mentorapredict-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prediction-service:
    image: ${DOCKERHUB_USERNAME}/prediction-service:${IMAGE_TAG:-main-latest}
    container_name: mp_prediction_service
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 448M
    expose:
      - "3006"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3006
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MONGO_HOST: ${MONGO_HOST:-mongo}
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DB: ${MONGO_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      ANALYTICS_SERVICE_URL: ${ANALYTICS_SERVICE_URL:-http://mp_analytics_service:3004}
      ACADEMIC_SERVICE_URL: ${ACADEMIC_SERVICE_URL:-http://mp_academic_service:3003}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SWAGGER_SERVER_URL: ${SWAGGER_SERVER_URL:-https://mentorapredictprod.programacionwebuce.net}
    volumes:
      - ../keys:/secrets:ro
    networks:
      - mentorapredict-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3006/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ${DOCKERHUB_USERNAME}/web:${IMAGE_TAG:-main-latest}
    container_name: mp_web
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    expose:
      - "80"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    networks:
      - mentorapredict-net
    depends_on:
      - kong
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  landing:
    image: ${DOCKERHUB_USERNAME}/landing:${IMAGE_TAG:-main-latest}
    container_name: mp_landing
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    expose:
      - "80"
    networks:
      - mentorapredict-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  seed-loader:
    build:
      context: ../..
      dockerfile: database/Dockerfile.seed
    container_name: mp_seed_loader
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    restart: "no"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    networks:
      - mentorapredict-net
